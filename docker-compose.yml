version: '3.8'

services:
  open-nof1-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-auto-trading
    restart: unless-stopped
    ports:
      - "${PORT:-3100}:3100"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      # 出口代理：经宿主机 Clash(7890) 出海，避免国内直连被 Binance 封禁/地域限制
      # NODE_USE_ENV_PROXY 是 Node 24 内置能力，Node 20 的 fetch 不认这些变量
      - NODE_USE_ENV_PROXY=1
      - HTTP_PROXY=http://host.docker.internal:7890
      - HTTPS_PROXY=http://host.docker.internal:7890
      - NO_PROXY=localhost,127.0.0.1
    # 让容器能通过 host.docker.internal 访问宿主机上的 Clash
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 挂载数据库目录以持久化数据
      - ./voltagent-data:/app/.voltagent
      # 挂载日志目录（可选）
      - ./logs:/app/logs
    networks:
      - trading-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3100/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  trading-network:
    driver: bridge

